# Coolify runtime configuration.
# Secrets and the Hermes API key are injected as environment variables.

llm:
  provider: hermes
  model: hermes-agent
  api_key_env: API_SERVER_KEY
  max_tokens: 220
  temperature: 0.3
  history_turns: 12

hermes:
  # The existing Hermes service is private behind its authenticated HTTPS URL.
  base_url: "${JARVIS_HERMES_BASE_URL}"
  api_key_env: API_SERVER_KEY
  conversation: jarvis-main
  session_key: jarvis:user:main
  timeout: 240
  ack_after_seconds: 0
  ack_texts: ["On it.", "Still working.", "Almost there."]
  fallback_provider:
  instructions: >
    You are speaking aloud through a voice pipeline. Replies are converted
    to speech, so use plain conversational prose only: no markdown, no lists,
    no code blocks. Default to one to three short sentences unless asked for
    more detail. Speak numbers, dates, times and phone numbers as natural
    spoken words. Never speak secrets, API keys, or passwords aloud.

stt:
  model: small.en
  device: cpu
  compute_type: int8
  sample_rate: 16000
  partials: true
  partial_interval: 1.2

machines: []

usage:
  llm_cost_per_mtok_input: 0
  llm_cost_per_mtok_output: 0

server:
  host: 0.0.0.0
  # Coolify terminates TLS and forwards HTTP plus WebSockets to this port.
  port: 8765
  tls_ports: []
  dashboard_proxy: {}

security:
  hud_token_env: JARVIS_HUD_TOKEN
  # The public Coolify hostname is injected by JARVIS_PUBLIC_HOST.
  extra_origin_hosts: ["${JARVIS_PUBLIC_HOST}"]

voice:
  provider: elevenlabs
  model: eleven_flash_v2_5
  voice_name: "${JARVIS_VOICE_NAME:-Jarvis}"
  voice_id: "${ELEVENLABS_VOICE_ID:-}"
  # Standard voice available on free/basic ElevenLabs accounts. The requested
  # voice is attempted first; this is used only when the account tier rejects it.
  fallback_voice_id: "${ELEVENLABS_FALLBACK_VOICE_ID:-CwhRBWXzGAHq8TQ4Fs17}"
  output_format: pcm_16000

persona:
  system_prompt: >
    You are the spoken interface for the user's personal agent. Be direct,
    calm, and concise. Default to one to three short sentences.
